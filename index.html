<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-zinc-950 text-white flex justify-center pt-10 min-h-screen">
  <div class="w-full max-w-md">
    <h1 class="text-4xl font-bold mb-2">To-Do List</h1>

    <div class="flex gap-2 mb-2">
      <input type="text" id="taskInput" class="flex-1 p-2 rounded bg-zinc-800 text-white" placeholder="Add a new task...">
      <button id="addTaskButton" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Add</button>
    </div>

    <ul id="taskList">

    </ul>

  </div>
  <script src="main.js"></script>
</body>

</html>
